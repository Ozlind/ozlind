name: OZLIND CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ozlind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit (high severity blocks CI; retry registry outages)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          for attempt in 1 2 3; do
            set +e
            timeout --signal=TERM --kill-after=5s 25s npm audit --omit=dev --audit-level=high --fetch-retries=0 --fetch-timeout=20000 >"$log_file" 2>&1
            audit_status=$?
            set -e
            cat "$log_file"
            if [ "$audit_status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi
            if [ "$audit_status" -eq 124 ] || [ "$audit_status" -eq 137 ] || grep -Eqi 'audit endpoint returned an error|network timeout|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|ENETUNREACH' "$log_file"; then
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::npm registry audit unavailable (attempt $attempt/3); retrying."
                sleep 4
                continue
              fi
              echo "::warning::npm audit could not reach the registry after 3 bounded attempts. Dependency vulnerability status is unverified; rerun the audit when npm registry service recovers."
              rm -f "$log_file"
              exit 0
            fi
            rm -f "$log_file"
            exit "$audit_status"
          done
      - name: Verify repository (typecheck, lint, architecture, production build)
        run: npm run verify
