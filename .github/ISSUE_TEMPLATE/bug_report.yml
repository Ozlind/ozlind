name: Bug report
description: Report a reproducible Ozlind AI defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, OAuth codes, access tokens, private documents, or other sensitive user data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
      placeholder: "Expected ...; observed ..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ... 2. Select ... 3. Observe ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Chat / streaming
        - Authentication
        - Documents / workspace
        - Voice / vision
        - Web research
        - Settings / preferences
        - Responsive UI / accessibility
        - Deployment / configuration
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or deployment ID
      description: Provide a SHA or deployment ID if known; never provide secret values.
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Include error codes, request IDs, browser/OS, and screenshots with private information removed.
  - type: textarea
    id: scope
    attributes:
      label: Impact and workaround
