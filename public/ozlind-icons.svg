<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true">
  <defs>

  <!-- ============ PRIMARY MARK ============
       Geometry: a circle (wholeness / intelligence) is met by a precise
       diagonal cut whose two edges rise to a single point beyond the
       circle's own edge (direction / exploration / precision), with a
       single detached node beyond the point (a discovered idea / a
       connection made). One continuous silhouette, one accent node —
       nothing decorative, nothing borrowed. -->
  <symbol id="ozl-mark" viewBox="0 0 96 96">
    <path d="M78.07 37.06 A32 32 0 1 1 58.94 17.93 L78.55 17.45 Z" fill="currentColor"/>
    <circle cx="84.2" cy="11.8" r="4.6" fill="var(--dot-color, currentColor)"/>
  </symbol>

  <!-- wordmark accent glyph: the same node, used as the brand's signature dot -->
  <symbol id="ozl-node" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="currentColor"/></symbol>

  <!-- ============ SPECIAL SYMBOL FAMILY (24x24) ============ -->
